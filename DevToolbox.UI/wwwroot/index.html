<!DOCTYPE html>
<!-- data-theme is written by the boot script below before first paint. It is
     left off the markup on purpose so the file never disagrees with the saved
     preference. -->
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>DevToolbox</title>
    <base href="/" />
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Colour tokens. Must come first: output.css and dashboard.css both
         resolve their colours through the variables declared here. -->
    <link href="css/theme.css" rel="stylesheet" />
    <!-- The seasonal palettes, and the animation layer one of them can switch on.
         Both after theme.css: every selector in them is :root[data-theme=...], so
         they only have to outrank the base tokens declared there. -->
    <link href="css/themes.css" rel="stylesheet" />
    <link href="css/themeEffects.css" rel="stylesheet" />
    <!-- Theme boot. Inline and before the body so the correct palette is in
         place at first paint — a deferred script would flash the wrong theme.
         Order matters within it: the catalog is data the other two read, and the
         effects layer must have registered itself before boot() asks for snow. -->
    <script src="js/themeCatalog.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/themeEffects.js"></script>
    <script>window.devtoolboxTheme.boot();</script>
    <!-- Tailwind CSS -->
    <link href="css/output.css" rel="stylesheet" />
    <!-- Keep Bootstrap Icons for now -->
    <link href="css/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Dashboard layout; plain CSS so it does not need the Tailwind npm build -->
    <link href="css/dashboard.css" rel="stylesheet" />
    <!-- Theme-scoped ornament (the (Better)Christmas garland, tree and footer snow).
         Last of the stylesheets because it is the only one that has to out-specify
         dashboard.css and the Tailwind build rather than merely be read by them. -->
    <link href="css/themeDecor.css" rel="stylesheet" />
    <style>
        /* Allow highlighting/copying text in the Log Viewer results (independent of Tailwind build). */
        #logResultsTable,
        #logResultsTable td,
        #logResultsTable th span {
            -webkit-user-select: text;
            user-select: text;
        }
        #logResultsTable td { cursor: text; }
    </style>
    <script src="js/menu.js"></script>
    <script src="js/search.js"></script>
    <script src="js/logTools.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        // Fix for Windows scaling issues
        if (window.navigator.userAgent.indexOf('Windows') !== -1) {
            const scale = window.devicePixelRatio;
            if (scale !== 1) {
                document.querySelector('meta[name="viewport"]').setAttribute('content', 
                    'width=device-width, initial-scale=' + (1 / scale) + ', maximum-scale=' + (1 / scale) + ', user-scalable=no');
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <div id="loading-message" class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-accent-blue mb-4"></div>
                <div class="text-lg text-dark-text-muted">Loading DevToolbox...</div>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui" class="fixed bottom-4 right-4 bg-danger text-white px-4 py-3 rounded-lg shadow-lg" style="display:none;">
        An error has occurred. The application may no longer respond.
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('Error:', message, 'at', source, lineno, colno);
            document.getElementById('blazor-error-ui').style.display = 'block';
            document.getElementById('blazor-error-ui').textContent = 'JavaScript error: ' + message;
        };
    </script>
    <script src="_framework/blazor.webview.js"></script>
    <script>
        // Check if Blazor object exists
        setTimeout(function() {
            if (window.Blazor) {
                console.log("Blazor initialized successfully");
            } else {
                console.error("Blazor failed to initialize");
                document.getElementById('blazor-error-ui').style.display = 'block';
                document.getElementById('blazor-error-ui').textContent = 'Blazor failed to initialize after 5 seconds';
            }
        }, 5000);
    </script>
</body>
</html>
